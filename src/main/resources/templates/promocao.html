<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: cabecalho('Promoções')}"></head>
<body>
<header th:replace="~{layout :: menu}"></header>

<main class="conteudo">
	<h1>E-mail promocional</h1>
	<p>Oferta de 5% no tênis mais caro do último pedido, 30 dias após a compra.</p>

	<form class="linha" method="post" th:action="@{/promocoes}">
		<label>Cliente
			<select name="clienteId" required>
				<option value="">Selecione o cliente</option>
				<option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nomeCompleto}"
				        th:selected="${clienteId != null and c.id == clienteId}">Cliente</option>
			</select>
		</label>
		<button class="botao" type="submit">Gerar e-mail</button>
	</form>

	<div th:if="${aviso}" class="aviso" th:text="${aviso}">Aviso.</div>

	<div th:if="${email}" class="email">
		<h2>Mensagem gerada</h2>
		<p><strong>Para:</strong> <span th:text="${email.cliente.nomeCompleto}">Cliente</span></p>
		<p><strong>Assunto:</strong> <span th:text="${email.assunto}">Assunto</span></p>
		<pre th:text="${email.corpo}">Corpo do e-mail.</pre>
		<p class="nota">O envio é registrado no log da aplicação. Com um servidor SMTP configurado, a mesma mensagem pode ser enviada por e-mail.</p>
	</div>
</main>

<footer th:replace="~{layout :: rodape}"></footer>
</body>
</html>
