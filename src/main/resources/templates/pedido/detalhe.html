<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: cabecalho('Pedido')}"></head>
<body>
<header th:replace="~{layout :: menu}"></header>

<main class="conteudo">
	<h1>Pedido <span th:text="${pedido.id}">1</span></h1>

	<dl class="detalhes">
		<dt>Cliente</dt>
		<dd th:text="${pedido.cliente.nomeCompleto}">Cliente</dd>
		<dt>Data</dt>
		<dd th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</dd>
		<dt>Forma de pagamento</dt>
		<dd th:text="${pedido.pagamento?.forma?.rotulo}">Pagamento</dd>
	</dl>

	<table>
		<thead>
			<tr><th>Produto</th><th>Quantidade</th><th>Valor unitário</th><th>Subtotal</th></tr>
		</thead>
		<tbody>
			<tr th:each="item : ${pedido.itens}">
				<td th:text="${item.produto.nome}">Produto</td>
				<td class="centro" th:text="${item.quantidade}">1</td>
				<td class="numero" th:text="${#numbers.formatCurrency(item.valorUnitario)}">R$ 0,00</td>
				<td class="numero" th:text="${#numbers.formatCurrency(item.subtotal)}">R$ 0,00</td>
			</tr>
		</tbody>
	</table>

	<dl class="detalhes">
		<dt>Valor total</dt>
		<dd th:text="${#numbers.formatCurrency(resumo.valorTotal)}">R$ 0,00</dd>
		<dt>Imposto</dt>
		<dd th:text="${#numbers.formatCurrency(resumo.imposto)}">R$ 0,00</dd>
		<dt>Total com imposto</dt>
		<dd th:text="${#numbers.formatCurrency(resumo.totalComImposto)}">R$ 0,00</dd>
	</dl>

	<p><a th:href="@{/pedidos}">Voltar aos pedidos</a></p>
</main>

<footer th:replace="~{layout :: rodape}"></footer>
</body>
</html>
