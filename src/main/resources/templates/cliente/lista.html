<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: cabecalho('Clientes')}"></head>
<body>
<header th:replace="~{layout :: menu}"></header>

<main class="conteudo">
	<div class="titulo-linha">
		<h1>Clientes</h1>
		<a class="botao" th:href="@{/clientes/novo}">
			<span th:replace="~{icones :: adicionar}"></span>
			<span>Novo cliente</span>
		</a>
	</div>

	<p th:if="${#lists.isEmpty(clientes)}">Nenhum cliente cadastrado ainda.</p>

	<div class="rolagem">
	<table th:unless="${#lists.isEmpty(clientes)}">
		<thead>
			<tr>
				<th>Id</th><th>Nome</th><th>Gênero</th><th>Nascimento</th><th>Cadastro</th><th>Telefone</th><th>Cidade</th><th>Ações</th><th>Ficha</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="cliente : ${clientes}">
				<td th:text="${cliente.id}">1</td>
				<td th:text="${cliente.nomeCompleto}">Nome</td>
				<td th:text="${cliente.genero.rotulo}">Gênero</td>
				<td th:text="${#temporals.format(cliente.dataNascimento, 'dd/MM/yyyy')}">01/01/2000</td>
				<td th:text="${#temporals.format(cliente.dataCadastro, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
				<td th:text="${cliente.telefone}">Telefone</td>
				<td>
					<span th:text="${cliente.endereco.cidade}">Cidade</span><br/>
					<span class="nota" th:text="${cliente.endereco.pais.rotulo}">País</span>
				</td>
				<td class="acoes">
					<a class="acao" th:href="@{/clientes/{id}/editar(id=${cliente.id})}">
						<span th:replace="~{icones :: editar}"></span>
						<span>Editar</span>
					</a>
					<form th:action="@{/clientes/{id}/excluir(id=${cliente.id})}" method="post"
					      onsubmit="return confirm('Excluir o cliente e a ficha em cascata?');">
						<button class="acao link-perigo" type="submit">
							<span th:replace="~{icones :: excluir}"></span>
							<span>Excluir</span>
						</button>
					</form>
				</td>
				<td class="acoes">
					<a class="acao" th:if="${cliente.fichaClinica == null}"
					   th:href="@{/clientes/{id}/ficha/novo(id=${cliente.id})}">
						<span th:replace="~{icones :: adicionar}"></span>
						<span>Nova</span>
					</a>
					<a class="acao" th:if="${cliente.fichaClinica != null}"
					   th:href="@{/clientes/{id}/ficha/editar(id=${cliente.id})}">
						<span th:replace="~{icones :: editar}"></span>
						<span>Editar</span>
					</a>
					<form th:if="${cliente.fichaClinica != null}"
					      th:action="@{/clientes/{id}/ficha/excluir(id=${cliente.id})}" method="post">
						<button class="acao link-perigo" type="submit">
							<span th:replace="~{icones :: excluir}"></span>
							<span>Excluir</span>
						</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
	</div>
</main>

<footer th:replace="~{layout :: rodape}"></footer>
</body>
</html>
