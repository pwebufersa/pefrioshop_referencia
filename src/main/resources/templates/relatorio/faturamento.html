<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: cabecalho('Faturamento')}"></head>
<body>
<header th:replace="~{layout :: menu}"></header>

<main class="conteudo">
	<h1>Faturamento dos últimos 12 meses</h1>

	<form class="linha centralizada" method="get" th:action="@{/relatorios/faturamento}">
		<label>Data de referência
			<input type="date" name="referencia" th:value="${referencia}"/>
		</label>
		<button class="botao" type="submit">
			<span th:replace="~{icones :: atualizar}"></span>
			<span>Atualizar</span>
		</button>
	</form>

	<table>
		<thead><tr><th>Mês</th><th>Faturamento</th></tr></thead>
		<tbody>
			<tr th:each="linha : ${linhas}">
				<td th:text="${linha.mes}">01/2026</td>
				<td class="numero" th:text="${#numbers.formatCurrency(linha.faturamento)}">R$ 0,00</td>
			</tr>
		</tbody>
		<tfoot>
			<tr>
				<th scope="row">Faturamento total</th>
				<td class="numero" th:text="${#numbers.formatCurrency(total)}">R$ 0,00</td>
			</tr>
			<tr>
				<th scope="row">Imposto
					<span class="nota" th:text="'(' + ${#numbers.formatDecimal(taxaPercentual, 1, 1)} + '%)'">(18,5%)</span>
				</th>
				<td class="numero" th:text="${#numbers.formatCurrency(imposto)}">R$ 0,00</td>
			</tr>
			<tr>
				<th scope="row">Total com imposto</th>
				<td class="numero" th:text="${#numbers.formatCurrency(totalComImposto)}">R$ 0,00</td>
			</tr>
		</tfoot>
	</table>
</main>

<footer th:replace="~{layout :: rodape}"></footer>
</body>
</html>
