<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: cabecalho('Novatos')}"></head>
<body>
<header th:replace="~{layout :: menu}"></header>

<main class="conteudo">
	<h1>Clientes novatos</h1>

	<form class="linha" method="get" th:action="@{/relatorios/novatos}">
		<label>Mês (1 a 12)
			<input type="number" name="mes" min="1" max="12" th:value="${mes}"/>
		</label>
		<label>Ano
			<input type="number" name="ano" min="2000" max="2100" th:value="${ano}"/>
		</label>
		<button class="botao" type="submit">Consultar</button>
	</form>

	<p th:if="${#lists.isEmpty(clientes)}">Nenhum cliente cadastrado no período informado.</p>

	<table th:unless="${#lists.isEmpty(clientes)}">
		<thead><tr><th>Id</th><th>Nome completo</th><th>Data de cadastro</th></tr></thead>
		<tbody>
			<tr th:each="c : ${clientes}">
				<td th:text="${c.id}">1</td>
				<td th:text="${c.nomeCompleto}">Nome</td>
				<td th:text="${#temporals.format(c.dataCadastro, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
			</tr>
		</tbody>
	</table>
</main>

<footer th:replace="~{layout :: rodape}"></footer>
</body>
</html>
