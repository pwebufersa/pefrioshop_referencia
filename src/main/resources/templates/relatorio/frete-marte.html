<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: cabecalho('Frete para Marte')}"></head>
<body>
<header th:replace="~{layout :: menu}"></header>

<main class="conteudo">
	<h1>Frete para Marte</h1>
	<p>Valor por par: <strong th:text="${#numbers.formatCurrency(fretePorPar)}">R$ 0,00</strong></p>

	<p th:if="${#lists.isEmpty(itens)}">Nenhum produto cadastrado.</p>

	<table th:unless="${#lists.isEmpty(itens)}">
		<thead><tr><th>Código</th><th>Nome</th><th>Preço</th><th>Nº BR</th><th>Frete estimado</th></tr></thead>
		<tbody>
			<tr th:each="linha : ${itens}">
				<td th:text="${linha.produto.id}">1</td>
				<td th:text="${linha.produto.nome}">Produto</td>
				<td class="numero" th:text="${#numbers.formatCurrency(linha.produto.precoVenda)}">R$ 0,00</td>
				<td th:text="${linha.produto.numeroBr}">40</td>
				<td class="numero" th:text="${#numbers.formatCurrency(linha.frete)}">R$ 0,00</td>
			</tr>
		</tbody>
	</table>
</main>

<footer th:replace="~{layout :: rodape}"></footer>
</body>
</html>
