spring.application.name=pefrioshop

# ===============================
# Banner
# ===============================
spring.output.ansi.enabled=always
application.title=PéFrioShop by Xico
application.version=0.0.1

# ===============================
# Logs
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.file.name=log/pefrioshop.log

# ===============================
# Mensagens
# ===============================
spring.messages.basename=messages
spring.messages.cache-duration=-1
spring.messages.encoding=UTF-8

# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.hbm2ddl.import_files=import.sql

# ===============================
# H2
# ===============================
spring.datasource.platform=h2
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:pefrioshop;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=admin
spring.datasource.password=admin
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Acentuação
spring.datasource.sql-script-encoding=UTF-8
spring.datasource.connectionInitSql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ===============================
# Idioma fixo: a formatação de número e data sai em pt-BR
# ===============================
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# ===============================
# Regras de negócio (não ficam no código)
# ===============================
pefrioshop.imposto=0.185
pefrioshop.desconto-email=0.05
pefrioshop.desconto-relatorio=0.073
# Frete para Marte: viagem fixa somada ao preço do quilo transportado.
# US$ 100 milhões por tonelada métrica é o preço publicado pela SpaceX para
# carga ao solo marciano, a partir de 2028, o que dá US$ 100.000,00 por quilo.
# O câmbio é o dólar comercial de 16/10/2026.
pefrioshop.frete-marte-baseline=987654.33
pefrioshop.frete-marte-por-quilo-dolar=100000.00
pefrioshop.cambio-dolar=5.0849
pefrioshop.dias-email-promocional=30
pefrioshop.whatsapp=5584999990000

# ===============================
# Upload da foto do produto
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
